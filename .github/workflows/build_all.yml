name: Build all

on:
  push:
    branches:
     - main
     - release/*
    paths:
     - 'deps/**'
     - 'deps_src/**'
     - 'src/**'
     - 'cmake/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - 'localization/**'
     - 'resources/**'
     - ".github/workflows/build_*.yml"
     - 'build_linux.sh'
     - 'build_release_vs2022.bat'
     - 'build_release_macos.sh'
     - 'scripts/flatpak/**'

  pull_request:
    branches:
     - main
     - release/*
    paths:
     - 'deps/**'
     - 'deps_src/**'
     - 'src/**'
     - 'cmake/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - ".github/workflows/build_*.yml"
     - 'build_linux.sh'
     - 'build_release_vs2022.bat'
     - 'build_release_macos.sh'
     - 'scripts/flatpak/**'


  schedule:
      - cron: '0 17 * * *' # run once a day at 1 AM Singapore time (UTC+8)

  workflow_dispatch: # allows for manual dispatch
    inputs:
      build-deps-only:
        description: 'Only build dependencies (bypasses caching)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
  

jobs:
  build_linux:
    name: Build Linux
    strategy:
      fail-fast: false
    # Don't run scheduled builds on forks:
    if: ${{ !cancelled() && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ubuntu-24.04
      build-deps-only: ${{ inputs.build-deps-only || false }}
    secrets: inherit
  build_all:
    name: Build Non-Linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: macos-14
            arch: arm64
    # Don't run scheduled builds on forks:
    if: ${{ !cancelled() && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
      force-build: ${{ github.event_name == 'schedule' }}
    secrets: inherit
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: build_linux
    if: ${{ !cancelled() && success() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            scripts
            tests
      - name: Apt-Install Dependencies
        uses: ./.github/actions/apt-install-deps
      - name: Restore Test Artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{ github.sha }}-tests
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"  # use most recent 3.28.x version
      - name: Unpackage and Run Unit Tests
        timeout-minutes: 20
        run: |
          tar -xvf build_tests.tar
          scripts/run_unit_tests.sh
      - name: Upload Test Logs
        uses: actions/upload-artifact@v5
        if: ${{ failure() }}
        with:
          name: unit-test-logs
          path: build/tests/**/*.log
      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "ctest_results.xml"
  flatpak:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
      volumes:
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
        - /opt/ghc:/opt/ghc1
        - /usr/local/share/boost:/usr/local/share/boost1
        - /opt/hostedtoolcache:/opt/hostedtoolcache1
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    # Don't run scheduled builds on forks:
    if: ${{ !cancelled() && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    runs-on: ${{ matrix.variant.runner }}
    env:
      date:
      ver:
      ver_pure:
    steps:
    - name: "Remove unneeded stuff to free disk space"
      run:
        rm -rf /usr/local/lib/android/* /usr/share/dotnet/* /opt/ghc1/* "/usr/local/share/boost1/*" /opt/hostedtoolcache1/*
    - uses: actions/checkout@v6
    - name: Get the version and date
      run: |
        ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          ver="PR-${{ github.event.number }}"
          git_commit_hash="${{ github.event.pull_request.head.sha }}"
        else
          ver=V$ver_pure
          git_commit_hash=""
        fi
        echo "ver=$ver" >> $GITHUB_ENV
        echo "ver_pure=$ver_pure" >> $GITHUB_ENV
        echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        echo "git_commit_hash=$git_commit_hash" >> $GITHUB_ENV
      shell: bash
    - uses: flatpak/flatpak-github-actions/flatpak-builder@master
      with:
        bundle: OrcaSlicer-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak
        manifest-path: scripts/flatpak/io.github.softfever.OrcaSlicer.yml
        cache: true
        arch: ${{ matrix.variant.arch }}
        upload-artifact: false
    - name: Upload artifacts Flatpak
      uses: actions/upload-artifact@v5
      with:
        name: OrcaSlicer-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak
        path: '/__w/OrcaSlicer/OrcaSlicer/OrcaSlicer-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak'
    - name: Deploy Flatpak to nightly release
      if: github.repository == 'OrcaSlicer/OrcaSlicer' && github.ref == 'refs/heads/main'
      uses: WebFreak001/deploy-nightly@v3.2.0
      with:
        upload_url: https://uploads.github.com/repos/OrcaSlicer/OrcaSlicer/releases/137995723/assets{?name,label}
        release_id: 137995723
        asset_path: /__w/OrcaSlicer/OrcaSlicer/OrcaSlicer-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak
        asset_name: OrcaSlicer-Linux-flatpak_nightly_${{ matrix.variant.arch }}.flatpak
        asset_content_type: application/octet-stream
        max_releases: 1 # optional, if there are more releases than this matching the asset_name, the oldest ones are going to be deleted

  # belt-hof: publish a rolling "nightly" GitHub Release on the FORK so the
  # macOS/Windows/Linux packages are downloadable by anyone (the upstream
  # "Deploy ... nightly" steps are all gated on repo==OrcaSlicer/OrcaSlicer and
  # point at the upstream release_id, so they never run here). Runs only on a
  # push to main of this fork, and only if the platform builds succeeded
  # (implicit success() gate via `needs` + a non-always `if`). Flatpak is
  # intentionally NOT a dependency: it is allowed to fail without blocking the
  # release; its bundles are attached only if present.
  publish_release:
    name: Publish nightly release
    needs: [build_linux, build_all]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tommasobbianchi/ShidaoSlicer' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            version.inc
      - name: Get the version
        run: echo "ver=V$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)" >> $GITHUB_ENV
        shell: bash
      - name: Get build id
        # YYYY_MM_DD_HH_MM from the head commit timestamp — identical to the value
        # baked into the binary (CMake -DORCABELT_BUILD_TIMESTAMP, shown in
        # Help -> About). SoftFever_VERSION is static across nightlies, so this is
        # what lets testers confirm exactly which build they run.
        run: |
          ts="${{ github.event.head_commit.timestamp }}"
          if [ -n "$ts" ]; then bid=$(date -u -d "$ts" +%Y_%m_%d_%H_%M); else bid=$(date -u +%Y_%m_%d_%H_%M); fi
          echo "build_id=${bid}" >> "$GITHUB_ENV"
        shell: bash
      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Assemble release files
        run: |
          set -x
          mkdir -p release
          # macOS DMG
          cp artifacts/ShidaoSlicer_Mac_universal_${ver}/*.dmg release/ 2>/dev/null || true
          # Windows installer (.exe)
          cp artifacts/ShidaoSlicer_Windows_${ver}/*.exe release/ 2>/dev/null || true
          # Windows portable: the artifact is an unzipped folder -> zip it
          if [ -d "artifacts/ShidaoSlicer_Windows_${ver}_portable" ]; then
            ( cd "artifacts/ShidaoSlicer_Windows_${ver}_portable" \
              && zip -rq "../../release/ShidaoSlicer_Windows_${ver}_portable.zip" . )
          fi
          # Linux AppImage(s) (any ubuntu variant)
          cp artifacts/ShidaoSlicer_Linux_*/*.AppImage release/ 2>/dev/null || true
          # Flatpak bundles (only if the flatpak job happened to succeed)
          cp artifacts/OrcaSlicer-Linux-flatpak_*/*.flatpak release/ 2>/dev/null || true
          # belt: keep the stable _${ver} names (fixed campaign download link) AND
          # add a build-id-stamped copy of each, so a downloaded file is itself
          # self-identifying. Stale stamped assets are pruned in the next step.
          ( cd release
            for f in *; do
              [ -f "$f" ] || continue
              case "$f" in *_"${build_id}".*) continue ;; esac
              base="${f%.*}"; ext="${f##*.}"
              cp -- "$f" "${base}_${build_id}.${ext}"
            done )
          echo "=== release/ ==="; ls -lh release/
        shell: bash
      - name: Prune previous build-id assets from nightly
        # The stable _${ver} assets are overwritten in place by the publish step;
        # the build-id-stamped ones have a unique name each run, so delete the old
        # stamped ones here to stop the rolling release from accumulating them.
        run: |
          gh release view nightly --repo "${{ github.repository }}" --json assets \
            -q '.assets[].name' 2>/dev/null \
            | grep -E '_20[0-9]{2}_[0-9]{2}_[0-9]{2}_[0-9]{2}_[0-9]{2}\.' \
            | while read -r a; do
                echo "deleting stale stamped asset: $a"
                gh release delete-asset nightly "$a" --repo "${{ github.repository }}" -y || true
              done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
      - name: Publish to rolling nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "ShidaoSlicer Nightly — build ${{ env.build_id }} (${{ env.ver }})"
          prerelease: true
          fail_on_unmatched_files: false
          files: release/*
          body: |
            Rolling nightly build from the latest `main` (commit ${{ github.sha }}).

            **Build `${{ env.build_id }}`** — confermalo in app: Help → About, riga `Build <hash> (${{ env.build_id }})`.

            ShidaoSlicer — fork di OrcaSlicer con supporto nativo per stampanti **belt / nastro** (45° inclinato, stile CR-30 / IdeaFormer IR3).

            ## Download
            | Piattaforma | File |
            |---|---|
            | **macOS** (universal) | `ShidaoSlicer_Mac_universal_*.dmg` |
            | **Windows** (installer) | `ShidaoSlicer_Windows_Installer_*.exe` |
            | **Windows** (portable) | `ShidaoSlicer_Windows_*_portable.zip` |
            | **Linux** (AppImage) | `ShidaoSlicer_Linux_AppImage_*.AppImage` |

            > macOS: il DMG non e' firmato/notarizzato — al primo avvio tasto destro → Apri, oppure `xattr -dr com.apple.quarantine /Applications/ShidaoSlicer.app`.
            > Linux: `chmod +x` sull'AppImage prima di lanciarlo.
